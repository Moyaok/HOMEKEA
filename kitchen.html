<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ห้องครัว - HOME KEA</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="enhanced-style.css">
    <link rel="icon" type="image/png" href="logo1.png">
</head>

<body>

    <header class="navbar">
        <a href="index.html" class="logo">
            <img src="logo1.png" alt="HOME KEA Logo">
        </a>
        <nav>
            <a href="living-room.html">ห้องนั่งเล่น</a>
            <a href="bedroom.html">ห้องนอน</a>
            <a href="kitchen.html" class="active">ห้องครัว</a>
            <a href="contact.html">ติดต่อเรา</a>
            <div class="cart-icon-wrapper" onclick="goToCart()">
                <span class="cart-icon">🛒</span>
                <span class="cart-badge">0</span>
            </div>
        </nav>
    </header>

    <div class="breadcrumb">
        <a href="index.html">หน้าแรก</a> /
        <span>ห้องครัว</span>
    </div>

    <main>
        <section class="page-header">
            <h1>สินค้าในหมวด: ห้องครัว</h1>
            <p>ชุดครัว เคาน์เตอร์ ตู้จัดเก็บ และอุปกรณ์ทำครัวครบวงจร</p>
        </section>

        <section class="product-grid-container">
            <div class="filter-section">
                <div class="filter-controls">
                    <div class="search-box">
                        <input type="text" id="searchInput" placeholder="ค้นหาสินค้า..." onkeyup="filterProducts()">
                        <span class="search-icon">🔍</span>
                    </div>
                    <div class="filter-group">
                        <label>เรียงตาม:</label>
                        <select id="sortSelect" onchange="sortProducts()">
                            <option value="default">เริ่มต้น</option>
                            <option value="price-low">ราคา: ต่ำ - สูง</option>
                            <option value="price-high">ราคา: สูง - ต่ำ</option>
                            <option value="name">ชื่อสินค้า</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label>ช่วงราคา:</label>
                        <select id="priceFilter" onchange="filterProducts()">
                            <option value="all">ทั้งหมด</option>
                            <option value="0-5000">0 - 5,000 ฿</option>
                            <option value="5000-10000">5,000 - 10,000 ฿</option>
                            <option value="10000-20000">10,000 - 20,000 ฿</option>
                            <option value="20000+">20,000+ ฿</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="product-grid" id="productGrid">
                <!-- Products will be rendered here -->
            </div>

            <div id="noResults" style="display: none; text-align: center; padding: 60px 20px;">
                <div style="font-size: 60px; color: #ddd;">🔍</div>
                <h3>ไม่พบสินค้าที่ค้นหา</h3>
                <p>ลองใช้คำค้นหาอื่นหรือปรับตัวกรอง</p>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>copyright &copy; Pongsakorn Manosri&Yannapat Saritdikul</p>
        </div>
    </footer>

    <!-- โหลด cart.js แค่ครั้งเดียวพอ -->
    <script src="cart.js"></script>

    <script>
        // ข้อมูลสินค้า – ห้องครัว
        const products = [{
            id: 'kitchen-1',
            title: 'ชุดเคาน์เตอร์ครัวบิวท์อินสีขาว',
            price: 25900,
            image: 'https://www.ikea.com/pimg/1035578_pe838113_s5.jpg?f=xl',
            category: 'ห้องครัว'
        }, {
            id: 'kitchen-2',
            title: 'ตู้แขวนครัวกระจกฝ้า รุ่น "GlassLine"',
            price: 8900,
            image: 'https://media.tarad.com/g/geng_heng/img-lib/spd_20140707102529_b.jpg',
            category: 'ห้องครัว'
        }, {
            id: 'kitchen-3',
            title: 'โต๊ะเตรียมอาหารสเตนเลส',
            price: 5200,
            image: 'https://inwfile.com/s-cw/pzrsdo.jpg',
            category: 'ห้องครัว'
        }];

        let filteredProducts = [...products];

        // แสดงสินค้า
        function renderProducts(productsToRender) {
            const grid = document.getElementById('productGrid');
            const noResults = document.getElementById('noResults');

            grid.innerHTML = '';

            if (!productsToRender.length) {
                grid.style.display = 'none';
                noResults.style.display = 'block';
                return;
            }

            grid.style.display = 'grid';
            noResults.style.display = 'none';

            productsToRender.forEach(product => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <div class="product-image">
                        <img src="${product.image}" alt="${product.title}">
                    </div>
                    <div class="product-info">
                        <h3 class="product-title">${product.title}</h3>
                        <p class="product-price">${product.price.toLocaleString()} ฿</p>
                        <button class="add-to-cart-btn">เพิ่มลงตะกร้า</button>
                    </div>
                `;

                // คลิกรูป → ไปหน้ารายละเอียด
                card.querySelector('.product-image').addEventListener('click', () => {
                    goToProductDetail(
                        product.id,
                        product.title,
                        product.price,
                        product.image,
                        product.category
                    );
                });

                // ปุ่มเพิ่มลงตะกร้า
                card.querySelector('.add-to-cart-btn').addEventListener('click', () => {
                    addToCart(
                        product.id,
                        product.title,
                        product.price,
                        product.image,
                        product.category
                    );
                });

                grid.appendChild(card);
            });
        }

        // ค้นหา + กรอง
        function filterProducts() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const priceRange = document.getElementById('priceFilter').value;

            filteredProducts = products.filter(product => {
                const matchesSearch = product.title.toLowerCase().includes(searchTerm);

                let matchesPrice = true;
                if (priceRange !== 'all') {
                    const [min, maxRaw] = priceRange.split('-');
                    const minPrice = parseInt(min || '0', 10);
                    const maxPrice = maxRaw ? parseInt(maxRaw.replace('+', ''), 10) : Infinity;
                    matchesPrice = product.price >= minPrice && product.price <= maxPrice;
                }

                return matchesSearch && matchesPrice;
            });

            sortProducts();
        }

        // เรียงลำดับ
        function sortProducts() {
            const sortValue = document.getElementById('sortSelect').value;
            let list = [...filteredProducts];

            if (sortValue === 'price-low') {
                list.sort((a, b) => a.price - b.price);
            } else if (sortValue === 'price-high') {
                list.sort((a, b) => b.price - a.price);
            } else if (sortValue === 'name') {
                list.sort((a, b) => a.title.localeCompare(b.title));
            }

            renderProducts(list);
        }

        // ไปหน้ารายละเอียดสินค้า (ใช้แบบเดียวกับห้องนั่งเล่น)
        function goToProductDetail(id, title, price, image, category) {
            const url = new URL('product-detail.html', window.location.href);
            url.searchParams.set('id', id);
            url.searchParams.set('title', title);
            url.searchParams.set('price', price);
            url.searchParams.set('image', image);
            url.searchParams.set('category', category);
            window.location.href = url.toString();
        }

        // โหลดครั้งแรก
        renderProducts(products);
    </script>

    <!-- Floating Cart Button -->
    <div class="floating-cart" onclick="goToCart()" role="button" aria-label="ตะกร้าสินค้า" tabindex="0" onkeypress="handleCartKeyPress(event)">
        <div class="floating-cart-button">
            <span class="floating-cart-icon">🛒</span>
            <span class="floating-cart-badge" id="floatingCartBadge">0</span>
        </div>
        <div class="floating-cart-tooltip">
            ตะกร้าสินค้า
        </div>
        <div class="floating-cart-preview" id="floatingCartPreview">
            <div class="cart-preview-items">
                <span id="previewItemCount">0</span> รายการ
            </div>
            <div class="cart-preview-total">
                ฿<span id="previewTotal">0</span>
            </div>
        </div>
    </div>

    <script>
        // อัพเดท Badge ของ Floating Cart
        function updateFloatingCart() {
            const badge = document.getElementById('floatingCartBadge');
            const itemCount = document.getElementById('previewItemCount');
            const totalAmount = document.getElementById('previewTotal');
            const floatingCart = document.querySelector('.floating-cart');

            if (badge && itemCount && totalAmount) {
                const count = cart.getItemCount();
                const total = cart.getTotal();

                badge.textContent = count;
                itemCount.textContent = count;
                totalAmount.textContent = total.toLocaleString();

                if (count > 0) {
                    badge.style.display = 'flex';
                    floatingCart.classList.remove('empty-cart');
                } else {
                    badge.style.display = 'none';
                    floatingCart.classList.add('empty-cart');
                }
            }
        }

        function animateFloatingCart() {
            const floatingCart = document.querySelector('.floating-cart');
            floatingCart.classList.add('item-added', 'clicked');
            setTimeout(() => {
                floatingCart.classList.remove('item-added', 'clicked');
            }, 600);
        }

        // hook ฟังก์ชัน addToCart เดิมจาก cart.js
        const originalAddToCart = window.addToCart;
        window.addToCart = function(productId, title, price, image, category) {
            originalAddToCart(productId, title, price, image, category);
            animateFloatingCart();
            updateFloatingCart();
        };

        function handleCartKeyPress(event) {
            if (event.key === 'Enter' || event.key === ' ') {
                event.preventDefault();
                goToCart();
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            updateFloatingCart();
            setInterval(updateFloatingCart, 500);
        });

        if (typeof cart !== 'undefined') {
            const originalSaveCart = cart.saveCart.bind(cart);
            cart.saveCart = function() {
                originalSaveCart();
                updateFloatingCart();
            };
        }

        const originalGoToCart = window.goToCart;
        window.goToCart = function() {
            window.scrollTo({
                top: 0,
                behavior: 'smooth'
            });
            setTimeout(() => {
                originalGoToCart();
            }, 300);
        };
    </script>

</body>

</html>
