<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ตะกร้าสินค้า - HOME KEA</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="enhanced-style.css">
    <link rel="icon" type="image/png" href="logo1.png">

    <style>
        /* ===================================
           CSS สำหรับปุ่ม FLOATING CART
           =================================== */
        
        .floating-cart {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 1000;
            cursor: pointer;
            transition: transform 0.3s ease;
        }
        
        .floating-cart:hover {
            transform: scale(1.1);
        }
        
        .floating-cart-button {
            background-color: #ff9800;
            color: white;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            position: relative;
        }
        
        .floating-cart-icon {
            font-size: 24px;
        }
        
        .floating-cart-badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background-color: red;
            color: white;
            font-size: 12px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            border: 2px solid white;
        }
        /* Animation */
        
        .floating-cart.item-added {
            animation: bounce 0.5s;
        }
        
        @keyframes bounce {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.2);
            }
        }
        /* ซ่อนปุ่มถ้าตะกร้าว่าง (Optional) */
        
        .floating-cart.empty-cart {
            display: none;
        }
    </style>
</head>

<body>

    <header class="navbar">
        <a href="index.html" class="logo">
            <img src="image/logo1.png" alt="HOME KEA Logo">
        </a>
        <nav>
            <a href="living-room.html">ห้องนั่งเล่น</a>
            <a href="bedroom.html">ห้องนอน</a>
            <a href="kitchen.html">ห้องครัว</a>
            <a href="contact.html">ติดต่อเรา</a>
            <div class="cart-icon-wrapper" onclick="goToCart()">
                <span class="cart-icon">🛒</span>
                <span class="cart-badge" id="navbarCartBadge">0</span>
            </div>
        </nav>
    </header>

    <div class="breadcrumb">
        <a href="index.html">หน้าแรก</a> /
        <span>ตะกร้าสินค้า</span>
    </div>

    <main>
        <section class="page-header">
            <h1>ตะกร้าสินค้าของคุณ</h1>
            <p id="cartItemCount">คุณมี 0 รายการในตะกร้า</p>
        </section>

        <div class="cart-container">
            <div id="cartContent">
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>copyright &copy; Pongsakorn Manosri&Yannapat Saritdikul</p>
        </div>
    </footer>

    <div class="floating-cart" onclick="goToCart()" role="button" aria-label="ตะกร้าสินค้า">
        <div class="floating-cart-button">
            <span class="floating-cart-icon">🛒</span>
            <span class="floating-cart-badge" id="floatingCartBadge">0</span>
        </div>
    </div>

    <script src="cart.js"></script>
    <script>
        // ===================================
        // CART PAGE LOGIC
        // ===================================

        function renderCart() {
            const cartContent = document.getElementById('cartContent');

            // เช็คว่า cart object โหลดมาหรือไม่
            if (typeof cart === 'undefined') {
                console.error("cart.js ยังไม่โหลด");
                return;
            }

            const itemCount = cart.getItemCount();

            // อัพเดทข้อความหัวข้อ
            document.getElementById('cartItemCount').textContent = `คุณมี ${itemCount} รายการในตะกร้า`;

            // อัพเดท Badge ที่ Navbar ด้วย
            const navBadge = document.getElementById('navbarCartBadge');
            if (navBadge) navBadge.textContent = itemCount;

            // อัพเดท Floating Badge
            updateFloatingCart();

            // กรณีตะกร้าว่าง
            if (cart.items.length === 0) {
                cartContent.innerHTML = `
                    <div class="empty-cart">
                        <div class="empty-cart-icon" style="font-size: 80px; margin-bottom: 20px;">🛒</div>
                        <h2>ตะกร้าสินค้าของคุณว่างเปล่า</h2>
                        <p>เริ่มช้อปปิ้งและเพิ่มสินค้าลงตะกร้ากันเลย!</p>
                        <a href="index.html" class="cta-button" style="display: inline-block; margin-top: 20px; text-decoration: none;">
                            เริ่มช้อปปิ้ง
                        </a>
                    </div>
                `;
                return;
            }

            // กรณีมีสินค้า
            const cartGrid = document.createElement('div');
            cartGrid.className = 'cart-grid';

            // ส่วนรายการสินค้า (Left Side)
            const cartItems = document.createElement('div');
            cartItems.className = 'cart-items';
            cartItems.innerHTML = '<h2>รายการสินค้า</h2>';

            cart.items.forEach(item => {
                const cartItem = document.createElement('div');
                cartItem.className = 'cart-item';
                cartItem.innerHTML = `
                    <img src="${item.image}" alt="${item.title}" class="cart-item-image">
                    <div class="cart-item-info">
                        <h3>${item.title}</h3>
                        <p class="cart-item-category">${item.category}</p>
                    </div>
                    <div class="cart-item-price">${item.price.toLocaleString()} ฿</div>
                    <div class="quantity-controls">
                        <button class="qty-btn" onclick="updateItemQuantity('${item.id}', ${item.quantity - 1})">-</button>
                        <input type="number" class="qty-input" value="${item.quantity}" readonly>
                        <button class="qty-btn" onclick="updateItemQuantity('${item.id}', ${item.quantity + 1})">+</button>
                    </div>
                    <button class="remove-btn" onclick="removeItemFromCart('${item.id}')">ลบ</button>
                `;
                cartItems.appendChild(cartItem);
            });

            // ส่วนสรุปยอดเงิน (Right Side)
            const cartSummary = document.createElement('div');
            cartSummary.className = 'cart-summary';

            const subtotal = cart.getTotal();
            const shipping = subtotal >= 5000 ? 0 : 150;
            const total = subtotal + shipping;

            cartSummary.innerHTML = `
                <h2>สรุปคำสั่งซื้อ</h2>
                <div class="summary-row">
                    <span>ราคาสินค้า</span>
                    <span>${subtotal.toLocaleString()} ฿</span>
                </div>
                <div class="summary-row">
                    <span>ค่าจัดส่ง</span>
                    <span>${shipping === 0 ? 'ฟรี' : shipping.toLocaleString() + ' ฿'}</span>
                </div>
                ${shipping === 0 ? '' : `
                    <p style="font-size: 0.9em; color: #666; margin: 10px 0;">
                        💡 ซื้อเพิ่มอีก ${(5000 - subtotal).toLocaleString()} ฿ เพื่อรับส่งฟรี!
                    </p>
                `}
                <div class="summary-row total">
                    <span>ยอดรวมทั้งหมด</span>
                    <span>${total.toLocaleString()} ฿</span>
                </div>
                <button class="cta-button checkout-btn" onclick="proceedToCheckout()">
                    ดำเนินการชำระเงิน
                </button>
                <button class="cta-button checkout-btn" onclick="continueShopping()" 
                    style="background-color: white; color: var(--primary-blue); border: 2px solid var(--primary-blue); margin-top: 10px;">
                    เลือกซื้อสินค้าต่อ
                </button>
            `;

            cartGrid.appendChild(cartItems);
            cartGrid.appendChild(cartSummary);
            cartContent.innerHTML = ''; // Clear loading state
            cartContent.appendChild(cartGrid);
        }

        // Functions สำหรับจัดการสินค้า
        function updateItemQuantity(productId, newQuantity) {
            if (newQuantity < 1) {
                if (confirm('ต้องการลบสินค้านี้ออกจากตะกร้าหรือไม่?')) {
                    cart.removeItem(productId);
                    renderCart();
                }
            } else {
                cart.updateQuantity(productId, newQuantity);
                renderCart();
            }
        }

        function removeItemFromCart(productId) {
            if (confirm('ต้องการลบสินค้านี้ออกจากตะกร้าหรือไม่?')) {
                cart.removeItem(productId);
                renderCart();
            }
        }

        function proceedToCheckout() {
            // ตรวจสอบว่ามีหน้า checkout.html หรือไม่
            window.location.href = 'checkout.html';
        }

        function continueShopping() {
            window.location.href = 'index.html';
        }

        // ===================================
        // FLOATING CART LOGIC
        // ===================================
        function updateFloatingCart() {
            const badge = document.getElementById('floatingCartBadge');
            const floatingCart = document.querySelector('.floating-cart');

            if (typeof cart !== 'undefined' && badge) {
                const count = cart.getItemCount();
                badge.textContent = count;
                
                if (count > 0) {
                    badge.style.display = 'flex';
                    floatingCart.classList.remove('empty-cart');
                } else {
                    badge.style.display = 'none';
                    // floatingCart.classList.add('empty-cart');
                }
            }
        }

        // Override goToCart ในหน้านี้ให้เป็นการ Scroll to top แทน
        // เพราะเราอยู่ในหน้า cart แล้ว ไม่ต้อง refresh หรือ link ซ้ำ
        window.goToCart = function() {
            window.scrollTo({
                top: 0,
                behavior: 'smooth'
            });
        };

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            renderCart();
        });
    </script>
</body>

</html>
